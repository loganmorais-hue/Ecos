<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>senhanova</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .fundo-pagina {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("https://uploads.onecompiler.io/44gvyfsca/1788521232910/Wavez.png");
            padding: 20px;
        }

        .container-principal {
            width: 70%;
            background-color: #1b263b;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .icone-marca {
            padding-bottom: 25px;
            display: inline-block;
        }

        .titulo {
            color: #ffffff;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #e0e1dd;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 32px;
        }

        /* Campo Simulado */
        .caixa-entrada {
		      	background-color: inherit ;
            width: 100%;
            height: 56px;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 8px;
			color: #38bdf8;
			font-size: 14px;
        }
        .texto-link {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            margin-bottom: 40px;
        }

        /* Rodapé */
        button{
          text-decoration: none;
        }
        .linha-rodape {
            display: flex;
            justify-content: space-between;
            align-items: center;
            
        }
        button {
          background: none;
          color: inherit;
          border: none;
          font: inherit;
          cursor: pointer;
          
        }
        .botao-secundario {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 500;
            padding: 30px 12px;
        }
        .botao-principal {
            background-color: #ff7b00;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 32px;
            border-radius: 20px;
        }
        input:focus {
		  border-color: orange;
		  outline: none;
		}
    </style>
</head>
<body>

    <div class="fundo-pagina">
        <div class="container-principal">
            
            <div class="icone-marca">
                <img src="https://uploads.onecompiler.io/44gvyfsca/452959n5r/Logomarca.png.png" />
            </div>

            <div class="titulo">Recuperação da Conta

            </div>
            <div class="subtitulo">Digite seu e-mail cadastrado para redefinir a senha.
            </div>

        
					<input class="caixa-entrada" id="cadastro" placeholder="E-mail ou telefone">
           
            
            <div></div>
            
            <div class="linha-rodape">
                <div class="botao-secundario"><button >Criar conta</button></div>
                <div class="botao-principal"><button >Avançar</button></div>
            </div>

        </div>
    </div>

</body>
</html>
